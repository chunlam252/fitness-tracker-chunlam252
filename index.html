    const FriendsView = ({ logs }) => {
      const [selectedFriend, setSelectedFriend] = useState(null);

      // 1. Only count COMPLETED sessions (backward compat)
      const completed = logs.filter(l => l.status === 'completed' || !l.status);

      // If a friend is selected, show their specific logs and stats
      if (selectedFriend) {
        // Filter shared logs
        const sharedLogs = completed.filter(l => l.friends && l.friends.includes(selectedFriend));
        // Sort by date desc
        sharedLogs.sort((a,b) => new Date(b.date) - new Date(a.date));

        // Stats Logic
        const totalSharedCount = sharedLogs.length;
        const totalSharedHours = sharedLogs.reduce((acc, curr) => acc + (curr.durationMinutes || 0), 0) / 60;

        // Breakdown Logic
        const breakdown = CATEGORIES.map(cat => {
            const count = sharedLogs.filter(l => l.category === cat.value).length;
            const totalMins = sharedLogs.filter(l => l.category === cat.value).reduce((a,b) => a + (b.durationMinutes||0), 0);
            return { ...cat, count, totalMins };
        }).filter(x => x.count > 0).sort((a,b) => b.count - a.count);

        const maxCount = breakdown.length > 0 ? breakdown[0].count : 0;

        return (
            <div className="p-6 animate-slide-up pb-24">
                <div className="flex items-center gap-4 mb-6">
                    <button onClick={() => setSelectedFriend(null)} className="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 shadow-sm active:scale-95 transition-transform">
                        ←
                    </button>
                    <div>
                        <h2 className="text-xl font-black text-slate-800">{selectedFriend}</h2>
                        <p className="text-xs font-bold text-slate-400">好友詳情</p>
                    </div>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-6">
                     <div className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                        <div className="text-[10px] font-black text-slate-400 uppercase">共同運動</div>
                        <div className="text-2xl font-black text-slate-800 mt-1">{totalSharedCount}<span className="text-xs text-slate-400 ml-1">次</span></div>
                     </div>
                     <div className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                        <div className="text-[10px] font-black text-slate-400 uppercase">累積時數</div>
                        <div className="text-2xl font-black text-slate-800 mt-1">{totalSharedHours.toFixed(1)}<span className="text-xs text-slate-400 ml-1">hr</span></div>
                     </div>
                </div>

                {breakdown.length > 0 && (
                    <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm mb-6">
                       <h3 className="text-xs font-black text-slate-400 uppercase mb-3">運動偏好</h3>
                       <div className="space-y-3">
                           {breakdown.map(item => {
                               const percentage = Math.round((item.count / totalSharedCount) * 100);
                               // Relative bar width based on max item
                               const barWidth = maxCount > 0 ? (item.count / maxCount) * 100 : 0;
                               
                               return (
                                   <div key={item.value}>
                                       <div className="flex justify-between text-xs font-bold mb-1">
                                           <div className="flex items-center gap-1">
                                                <span>{item.icon}</span>
                                                <span className="text-slate-700">{item.value}</span>
                                           </div>
                                           <div className="text-slate-400">{item.count}次 ({percentage}%)</div>
                                       </div>
                                       <div className="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                                           <div className={`h-full ${item.color}`} style={{width: `${barWidth}%`}}></div>
                                       </div>
                                   </div>
                               );
                           })}
                       </div>
                    </div>
                )}

                <h3 className="text-xs font-black text-slate-400 uppercase mb-3 px-1">最近紀錄</h3>
                <div className="space-y-3">
                    {sharedLogs.map(l => (
                        <div key={l.id} className="p-4 rounded-3xl bg-white border border-slate-100 flex items-center gap-4 shadow-sm">
                             <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${CATEGORIES.find(c=>c.value===l.category)?.color} text-white`}>
                                {CATEGORIES.find(c=>c.value===l.category)?.icon}
                             </div>
                             <div className="flex-1">
                                <div className="font-bold text-slate-800 text-sm">{l.subcategory}</div>
                                <div className="text-[10px] text-slate-400 mt-1">
                                    {l.date} • {l.durationMinutes} min
                                </div>
                             </div>
                             <div className="text-lg">{l.mood}</div>
                        </div>
                    ))}
                </div>
            </div>
        );
      }
      
      const friendStats = {};
      completed.forEach(l => {
        if(l.friends) l.friends.forEach(f => {
           if(!friendStats[f]) friendStats[f] = { count: 0, lastDate: l.date };
           friendStats[f].count++;
           if(new Date(l.date) > new Date(friendStats[f].lastDate)) friendStats[f].lastDate = l.date;
        });
      });
      const sorted = Object.entries(friendStats).sort((a,b) => b[1].count - a[1].count);

      const daysSince = (dateStr) => {
        const diff = new Date() - new Date(dateStr + 'T00:00:00');
        return Math.floor(diff / (1000 * 60 * 60 * 24));
      };

      return (
        <div className="p-6 animate-slide-up pb-24">
           {sorted.length === 0 ?
             <div className="text-center py-10 opacity-50">
                <div className="text-4xl mb-2">👥</div>
                <p className="text-slate-400 text-sm font-bold">還沒有和朋友一起運動的紀錄</p>
                <p className="text-slate-300 text-xs mt-1">在「新增紀錄」時加入朋友名字即可</p>
             </div>
             :
             <div className="grid grid-cols-2 gap-3">
               {sorted.map(([name, data]) => {
                 const days = daysSince(data.lastDate);
                 const weeks = Math.floor(days / 7);
                 const isMissed = days > 14;
                 return (
                   <button key={name} onClick={() => setSelectedFriend(name)} className="bg-white p-4 rounded-3xl border border-slate-100 flex flex-col items-center gap-2 shadow-sm active:scale-95 transition-transform relative">
                     {isMissed && (
                       <div className="absolute top-2 right-2 bg-orange-100 text-orange-500 text-[9px] font-black px-1.5 py-0.5 rounded-full">🔔 {weeks}週</div>
                     )}
                     <div className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-lg uppercase ${isMissed ? 'bg-orange-100 text-orange-400' : 'bg-blue-100 text-blue-500'}`}>{name[0]}</div>
                     <div className="font-bold text-slate-800">{name}</div>
                     <div className="text-xs text-slate-400 font-bold bg-slate-50 px-2 py-1 rounded-full">{data.count} 次運動</div>
                     <div className={`text-[10px] font-bold ${isMissed ? 'text-orange-400' : 'text-slate-400'}`}>
                       上次: {days === 0 ? '今日' : days === 1 ? '昨日' : `${days}天前`}
                     </div>
                   </button>
                 );
               })}
             </div>
           }
        </div>
      );
    };

    const App = () => {
      // Reopening the app mid-workout goes straight back to the workout
      const [view, setView] = useState(() => localStorage.getItem(ACTIVE_WORKOUT_KEY) ? 'workout' : 'dashboard');
      const [friendsKey, setFriendsKey] = useState(0);
      const [logs, setLogs] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch(e) { return []; }
      });
      const [editLog, setEditLog] = useState(null);
      const [calendarDate, setCalendarDate] = useState(null);
      const [quickCategory, setQuickCategory] = useState(null);
      const [workoutActive, setWorkoutActive] = useState(() => !!localStorage.getItem(ACTIVE_WORKOUT_KEY));
      const [user, setUser] = useState(null);
      const [status, setStatus] = useState('初始化...');
      
      // New AI State in App level (Persistence)
      const [aiAdvice, setAiAdvice] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);
      const logsRef = useRef(logs);
      logsRef.current = logs;
      const userRef = useRef(null);
      const photoStored = useRef(new Map()); // id -> dataUrl already written to IndexedDB

      // Write logs to local storage: slim logs → localStorage, photos → IndexedDB
      const persistLocal = async (arr) => {
        const { slim, photos } = splitPhotos(arr);
        for (const [id, data] of Object.entries(photos)) {
          if (photoStored.current.get(id) !== data) { await idb.set(id, data); photoStored.current.set(id, data); }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
      };

      // Attach photos to logs that only have hasPhoto (from IndexedDB, else cloud)
      const hydratePhotos = async (arr, uid) => {
        const found = {};
        for (const l of arr) {
          if (!l.hasPhoto || l.photo) continue;
          let d = await idb.get(l.id);
          if (!d && uid) {
            try {
              const fb = initFirebase();
              const s = await getDoc(doc(fb.db, 'users', uid, 'photos', l.id));
              if (s.exists()) { d = s.data().data; await idb.set(l.id, d); }
            } catch (e) { /* photo not synced yet */ }
          }
          if (d) { found[l.id] = d; photoStored.current.set(l.id, d); }
        }
        if (Object.keys(found).length) setLogs(cur => cur.map(l => (found[l.id] && !l.photo) ? { ...l, photo: found[l.id] } : l));
      };

      // Merge with cloud and upload. Returns merged logs. Throws on failure.
      const pushCloud = async (arr, deleted) => {
        const u = userRef.current; const fb = initFirebase();
        if (!u || !fb) throw new Error('未登入');
        const ref = doc(fb.db, 'users', u.uid);
        const snap = await getDoc(ref);
        const cloud = snap.exists() ? snap.data() : {};
        const allDeleted = { ...(cloud.deleted || {}), ...deleted };
        const merged = mergeLogs(arr, cloud.logs || [], allDeleted); // local wins ties (keeps photo)
        const { slim, photos } = splitPhotos(merged);
        const size = JSON.stringify(slim).length;
        if (size > 900000) throw new Error(`紀錄資料過大 (${Math.round(size/1024)}KB)，超出雲端 1MB 上限`);
        await setDoc(ref, { logs: slim, deleted: allDeleted, updatedAt: new Date().toISOString() }, { merge: true });
        // photos: one small doc each, only if not uploaded yet
        const synced = new Set(readJson(PHOTO_SYNCED_KEY, []));
        let photoErr = null;
        for (const [id, data] of Object.entries(photos)) {
          const k = id + ':' + data.length;
          if (synced.has(k)) continue;
          try { await setDoc(doc(fb.db, 'users', u.uid, 'photos', id), { data }); synced.add(k); }
          catch (e) { photoErr = e; break; }
        }
        localStorage.setItem(PHOTO_SYNCED_KEY, JSON.stringify([...synced]));
        if (photoErr) throw Object.assign(new Error('相片同步失敗：' + (photoErr.code || photoErr.message)), { photoOnly: true });
        return merged;
      };

      const sigOf = (arr) => JSON.stringify(arr.map(l => [l.id, l._u || '']).sort());

      useEffect(() => {
        // One-time migration: move photos that are still inline in localStorage into IndexedDB
        (async () => {
          const raw = readJson(STORAGE_KEY, []);
          const { slim, photos } = splitPhotos(raw);
          if (Object.keys(photos).length) {
            try {
              for (const [id, d] of Object.entries(photos)) { await idb.set(id, d); photoStored.current.set(id, d); }
              localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
            } catch (e) { console.error('Photo migration failed (data untouched):', e); }
          }
          hydratePhotos(raw, null);
        })();
      }, []);

      useEffect(() => {
        const fb = initFirebase();
        if(!fb) {
            setStatus('本地模式 (Firebase 未配置)');
            return;
        }

        getRedirectResult(fb.auth).then(res => {
          if(res) console.log('Redirect Success');
        }).catch(console.error);

        let unsubSnap = null;
        const unsub = onAuthStateChanged(fb.auth, async (u) => {
          setUser(u);
          userRef.current = u;
          if (unsubSnap) { unsubSnap(); unsubSnap = null; }
          if (u) {
            setStatus('連線中...');
            const docRef = doc(fb.db, "users", u.uid);
            unsubSnap = onSnapshot(docRef, async (docSnap) => {
              try {
                const data = docSnap.exists() ? docSnap.data() : {};
                const cloudLogs = data.logs || [];
                const localDeleted = readJson(DELETED_KEY, {});
                const allDeleted = { ...(data.deleted || {}), ...localDeleted };
                localStorage.setItem(DELETED_KEY, JSON.stringify(allDeleted));
                const merged = mergeLogs(logsRef.current, cloudLogs, allDeleted);
                if (sigOf(merged) !== sigOf(logsRef.current)) {
                  logsRef.current = merged;
                  setLogs(merged);
                  await persistLocal(merged);
                }
                // cloud is missing something we have (or has inline photos / no doc yet) → push
                const cloudSlim = splitPhotos(cloudLogs);
                if (sigOf(merged) !== sigOf(cloudLogs) || Object.keys(cloudSlim.photos).length || !docSnap.exists()) {
                  await pushCloud(merged, localDeleted);
                }
                setStatus('已連線');
                hydratePhotos(merged, u.uid);
              } catch (e) {
                console.error('Sync error:', e);
                setStatus(e.photoOnly ? '⚠️ 紀錄已同步，相片未同步（見設定）' : '⚠️ 同步失敗：' + (e.code || e.message));
              }
            }, (e) => { console.error(e); setStatus('連線錯誤：' + (e.code || e.message)); });
          } else {
             setStatus('本地模式');
          }
        });
        return () => { unsub(); unsubSnap && unsubSnap(); };
      }, []);

      // AI Logic Function
      const generateAiAdvice = async (currentLogs, forceRefresh = false) => {
        const todayStr = getLocalTodayString();
        
        // 1. Check Cache (if not forced)
        if (!forceRefresh) {
            const cached = localStorage.getItem(AI_CACHE_KEY);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    // If the cached advice is from TODAY, use it
                    if (parsed.date === todayStr && parsed.advice) {
                        setAiAdvice(parsed.advice);
                        console.log("Using cached AI advice");
                        return;
                    }
                } catch(e) { console.error("Cache parse error", e); }
            }
        }

        if (!currentLogs || currentLogs.length === 0) {
            setAiAdvice("還沒有足夠的數據，請先記錄幾次運動！💪");
            return;
        }
        setAiLoading(true);
        try {
            // New separate logic for Today's Logs
            const todaysLogs = currentLogs.filter(l => l.date === todayStr);
            const todaysPlanStr = todaysLogs.length > 0 
                ? todaysLogs.map(l => `- ${l.status==='completed'?'✅ 已完成':'📅 計劃中'} [${l.category}]: ${l.subcategory} (${l.durationMinutes}min)`).join('\n')
                : "暫無特定計劃";

            // 7 Days History (Strictly LESS than today)
            // Updated to include Notes and Tech Notes
            const history = currentLogs
              .filter(l => (l.status === 'completed' || !l.status) && l.date < todayStr) 
              .sort((a,b) => new Date(b.date) - new Date(a.date))
              .slice(0, 7)
              .map(l => {
                  let logStr = `- ${l.date} [${l.category}]: ${l.subcategory} (${l.durationMinutes}min) [RPE:${l.effort||'N/A'}]`;
                  if (l.notes) logStr += `\n  - Note: ${l.notes}`;
                  if (l.improvement) logStr += `\n  - Tech Note: ${l.improvement}`;
                  return logStr;
              });

            // 7 Days Future (Strictly GREATER than today)
            const futurePlans = currentLogs
              .filter(l => l.status === 'planned' && l.date > todayStr)
              .sort((a,b) => new Date(a.date) - new Date(b.date))
              .slice(0, 7) 
              .map(l => `- ${l.date} [${l.category}]: ${l.subcategory} (${l.startTime}-${l.endTime})`);

            const prompt = `
              Role: Professional Personal Trainer.
              User's Current Date: ${todayStr}

              [Today's Schedule (${todayStr})]:
              ${todaysPlanStr}

              [Past 7 Days History (Completed)]:
              ${history.join('\n') || "No recent history."}
              
              [Next 7 Days Plans (Future)]:
              ${futurePlans.join('\n') || "No future plans."}
              
              Task: Provide a 2-part analysis in Traditional Chinese (HK style).
              
              **IMPORTANT FORMATTING RULES**:
              1. You MUST start the first section with exactly: "Part 1: Today's Action"
              2. You MUST start the second section with exactly: "Part 2: Weekly Gap Analysis"
              
              Part 1: Today's Action (Status Check)
              - FIRST, check [Today's Schedule].
              - Pay close attention to the [Category] tag (e.g. [羽毛球], [Gym]).
              - **CRITICAL**: Check if there are any [Tech Note] (技術筆記) from past [Category] history.
              - If the user has a plan today (e.g., Badminton), and there is a past [Tech Note] for Badminton (e.g., "Backhand weak"), you MUST remind them to focus on correcting that specific issue today.
              - If there is ALREADY a plan (Planned or Completed), focus on that! Give a specific tip for that exercise.
              - Keep it short (1-2 sentences).
              
              Part 2: Weekly Gap Analysis
              - Look at the Next 7 Days Plans.
              - Identify days with NO plans or LONG gaps.
              - Suggest specific low-intensity activities or workouts to fill those gaps.
              
              Format: Use clear headings or bullet points. Use emojis.
            `;

            const key = getGeminiKey();
            if (!key) { setAiAdvice('⚙️ 請先在設定填入 Gemini API Key，AI 教練才能運作。'); setAiLoading(false); return; }
            let adviceText = "";
            try {
              adviceText = await geminiGenerate(prompt, key);
            } catch (e) {
              console.error("Gemini failed:", e);
              setAiAdvice(friendlyGeminiError(e));
              return;
            }
            
            if (adviceText) {
              setAiAdvice(adviceText);
              // 2. Save Cache
              localStorage.setItem(AI_CACHE_KEY, JSON.stringify({
                  date: todayStr,
                  advice: adviceText
              }));
            }
        } catch (error) {
            console.error("AI Error:", error);
            setAiAdvice("教練暫時斷線了，請稍後再試 😵‍💫");
        } finally {
            setAiLoading(false);
        }
      };

      // Initial AI Trigger (Only runs once if advice is empty and we have logs)
      useEffect(() => {
          if (logs.length > 0 && !aiAdvice && !aiLoading) {
              generateAiAdvice(logs);
          }
      }, [logs, aiAdvice]); // Re-trigger when aiAdvice is cleared (e.g. after user saves API key)

      const updateLogs = async (newLogs) => {
        const ts = new Date().toISOString();
        const old = logsRef.current;
        // stamp changed/new logs so the newest edit wins when merging devices
        const oldMap = new Map(old.map(l => [l.id, l]));
        const stamped = newLogs.map(l => {
          const o = oldMap.get(l.id);
          return (!o || JSON.stringify(o) !== JSON.stringify(l)) ? { ...l, _u: ts } : l;
        });
        // deletions become tombstones so other devices don't resurrect them
        const deleted = readJson(DELETED_KEY, {});
        const keep = new Set(newLogs.map(l => l.id));
        old.forEach(l => { if (!keep.has(l.id)) { deleted[l.id] = ts; idb.del(l.id); photoStored.current.delete(l.id); } });
        localStorage.setItem(DELETED_KEY, JSON.stringify(deleted));

        logsRef.current = stamped;
        setLogs(stamped);
        try { await persistLocal(stamped); }
        catch (e) { console.error('Local save failed:', e); setStatus('⚠️ 本機儲存失敗：' + (e.name || e.message)); }
        if (userRef.current) {
          try { await pushCloud(stamped, deleted); setStatus('已連線'); }
          catch (e) {
            console.error('Cloud sync failed:', e);
            setStatus(e.photoOnly ? '⚠️ 紀錄已同步，相片未同步（見設定）' : '⚠️ 同步失敗（已存本機）：' + (e.code || e.message));
          }
        }
      };

      // Manual full sync from Settings. Returns { ok, msg } for display.
      const forceSync = async () => {
        if (!userRef.current) return { ok: false, msg: '未登入 Google' };
        try {
          const merged = await pushCloud(logsRef.current, readJson(DELETED_KEY, {}));
          logsRef.current = mergeLogs(logsRef.current, merged, readJson(DELETED_KEY, {}));
          setLogs(logsRef.current);
          await persistLocal(logsRef.current);
          setStatus('已連線');
          return { ok: true, msg: `✓ 已同步 ${merged.length} 條紀錄` };
        } catch (e) {
          console.error(e);
          return { ok: false, msg: '❌ ' + (e.code ? e.code + '：' : '') + (e.message || e) };
        }
      };

      const handleSave = (log) => {
        const updated = editLog ? logs.map(l => l.id === log.id ? log : l) : [log, ...logs];
        updateLogs(updated);
        setEditLog(null);
        setView('dashboard');
      };

      const handleDelete = (id) => {
        updateLogs(logs.filter(l => l.id !== id));
        setEditLog(null);
        setView('dashboard');
      };

      const handleCopy = (sourceLog, dates) => {
        const newLogs = dates.map(date => ({
          ...sourceLog,
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          date,
          status: isFutureDate(date) ? 'planned' : 'completed',
        }));
        updateLogs([...newLogs, ...logs]);
        setEditLog(null);
        setView('dashboard');
      };

      const handleBatchSave = (entries) => {
        updateLogs([...entries, ...logs]);
        setView('dashboard');
      };

      const handleMarkDone = (id) => {
        updateLogs(logs.map(l => l.id === id ? { ...l, status: 'completed' } : l));
      };

      const handleRepeat = (sourceLog) => {
        const newLog = {
          ...sourceLog,
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          date: getLocalTodayString(),
          status: 'completed',
        };
        updateLogs([newLog, ...logs]);
      };

      const handleAuth = async () => {
        const fb = initFirebase();
        if(!fb) { alert("Firebase 初始化失敗"); return; }
        
        if (user) {
            await signOut(fb.auth);
        } else {
           try {
               const provider = new GoogleAuthProvider();
               await signInWithPopup(fb.auth, provider);
           } catch(e) {
               console.error("Login Error", e);
               if(e.code === 'auth/unauthorized-domain') {
                   alert("登入失敗：目前的網域 (或IP) 未在 Firebase Console 授權。");
               } else {
                   alert("登入錯誤: " + e.message);
               }
           }
        }
      };

      return (
        <Layout activeView={view} setView={(v) => {
          if (v === 'friends' && view === 'friends') {
            setFriendsKey(k => k + 1);
          }
          setView(v);
        }} user={user} status={status}
          workoutActive={workoutActive}
          onStartWorkout={() => { setWorkoutActive(true); setView('workout'); }}
          onQuickLog={(cat) => { setEditLog(null); setCalendarDate(null); setQuickCategory(cat); setView('add'); }}>
          {view === 'workout' && (
            <WorkoutSession
              logs={logs}
              onMinimize={() => setView('dashboard')}
              onDiscard={() => { localStorage.removeItem(ACTIVE_WORKOUT_KEY); setWorkoutActive(false); setView('dashboard'); }}
              onFinish={(log) => { localStorage.removeItem(ACTIVE_WORKOUT_KEY); setWorkoutActive(false); updateLogs([log, ...logsRef.current]); setView('dashboard'); }}
            />
          )}
          {view === 'dashboard' && (
             <Dashboard
                logs={logs}
                setView={setView}
                onEdit={(l)=>{setEditLog(l); setView('add');}}
                workoutActive={workoutActive}
                onStartWorkout={() => { setWorkoutActive(true); setView('workout'); }}
                onQuickLog={(cat) => { setEditLog(null); setCalendarDate(null); setQuickCategory(cat); setView('add'); }}
                aiAdvice={aiAdvice}
                aiLoading={aiLoading}
                onRefreshAi={() => generateAiAdvice(logs, true)}
                onMarkDone={handleMarkDone}
                onRepeat={handleRepeat}
             />
          )}
          {view === 'trends' && <Trends logs={logs} />}
          {view === 'calendar' && <Calendar logs={logs} onEdit={(l)=>{setEditLog(l); setCalendarDate(null); setView('add');}} onAddForDate={(date)=>{setEditLog(null); setQuickCategory(null); setCalendarDate(date); setView('add');}} onWeekPlan={()=>setView('weekplanner')} />}
          {view === 'friends' && <FriendsView key={friendsKey} logs={logs} />}
          {view === 'add' && <Form onSave={handleSave} onCancel={()=>{setEditLog(null); setCalendarDate(null); setView('dashboard');}} onDelete={handleDelete} onCopy={handleCopy} initData={editLog} logs={logs} defaultDate={calendarDate} defaultCategory={quickCategory || (calendarDate ? null : 'Gym')} key={(editLog?.id || 'new') + (quickCategory || '')} />}
          {view === 'weekplanner' && <WeekPlanner onBatchSave={handleBatchSave} onCancel={()=>setView('dashboard')} />}
          {view === 'settings' && <Settings user={user} handleAuth={handleAuth} setView={setView} onKeyChanged={() => { setAiAdvice(null); setAiLoading(false); }} logs={logs} onForceSync={forceSync} onImport={(arr) => updateLogs(mergeLogs(logsRef.current, arr, readJson(DELETED_KEY, {})))} />}
        </Layout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Offline support (network-first; see sw.js)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW register failed', e));
    }

    // iOS Safari / PWA viewport fix
    // When the keyboard opens, iOS shifts visualViewport.offsetTop upward.
    // We pin #root with position:fixed and move its top to counteract that shift,
    // so the app never flies off-screen.
    (function() {
      var rootEl = document.getElementById('root');
      function update() {
        if (window.visualViewport) {
          var vv = window.visualViewport;
          var h = vv.height, top = vv.offsetTop;
          // Home-screen (standalone) iOS under-reports the viewport height, leaving an
          // empty strip under the nav. With no keyboard open, use the real screen height.
          var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          var portrait = window.innerWidth < window.innerHeight;
          if (standalone && portrait && screen.height && h > screen.height - 140 && h < screen.height) { h = screen.height; top = 0; }
          rootEl.style.top = top + 'px';
          rootEl.style.height = h + 'px';
          document.documentElement.style.setProperty('--app-height', h + 'px');
        } else {
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
      }
      update();
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', update);
        window.visualViewport.addEventListener('scroll', update);
      } else {
        window.addEventListener('resize', update);
      }
    })();
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
