        try { return JSON.parse(localStorage.getItem(CUSTOM_EX_KEY) || '[]'); } catch { return []; }
      });
      const [infoEx, setInfoEx] = React.useState(null);

      const saveCustom = (name) => {
        const updated = [...new Set([name, ...customExs])]; // most recent first
        setCustomExs(updated);
        localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(updated));
        onSelect(name, 'Custom');
      };

      const groups = ['All', ...Object.keys(EXERCISE_DB), ...(customExs.length > 0 ? ['自訂'] : [])];
      const dbItems = Object.entries(EXERCISE_DB)
        .filter(([g]) => filterGroup === 'All' || g === filterGroup)
        .flatMap(([g, exs]) => exs.map(name => ({ name, group: g })));
      const customItems = (filterGroup === 'All' || filterGroup === '自訂')
        ? customExs.map(name => ({ name, group: 'Custom' }))
        : [];
      const filtered = [...customItems, ...dbItems]
        .filter(ex => !search || ex.name.toLowerCase().includes(search.toLowerCase()));
      if (!search) filtered.sort((a,b) => a.group==='Custom'&&b.group!=='Custom'?-1:b.group==='Custom'&&a.group!=='Custom'?1:a.name.localeCompare(b.name));

      return (
        <>
        <div className="fixed inset-0 z-50 flex flex-col justify-end" style={{background:'rgba(0,0,0,0.55)'}}>
          <div className="bg-white rounded-t-3xl flex flex-col" style={{maxHeight:'88vh'}}>
            <div className="flex items-center justify-between px-5 pt-5 pb-3">
              <h3 className="text-base font-black text-slate-800">選擇動作</h3>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center text-slate-400 text-lg font-bold">✕</button>
            </div>
            <div className="px-5 pb-3">
              <div className="flex items-center gap-2 bg-slate-100 rounded-2xl px-3 py-2.5">
                <span className="text-slate-400 text-sm">🔍</span>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋動作..." className="flex-1 bg-transparent text-sm font-bold text-slate-800 outline-none" />
                {search && <button onClick={()=>setSearch('')} className="text-slate-400 text-sm">✕</button>}
              </div>
            </div>
            <div className="flex gap-2 px-5 pb-3 overflow-x-auto" style={{scrollbarWidth:'none'}}>
              {groups.map(g => (
                <button key={g} onClick={()=>setFilterGroup(g)} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-black transition-all ${filterGroup===g?'bg-slate-800 text-white':'bg-slate-100 text-slate-500'}`}>{g}</button>
              ))}
            </div>
            <div className="overflow-y-auto flex-1 px-5 pb-10">
              {filtered.map((ex,i) => (
                <div key={i} className="flex items-center gap-3 py-2.5 border-b border-slate-50">
                  <button className="flex items-center gap-3 flex-1 min-w-0 text-left active:bg-slate-50 rounded-xl" onClick={()=>ex.group==='Custom'?saveCustom(ex.name):onSelect(ex.name, ex.group)}>
                    <MuscleSvg group={ex.group} size={38}/>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-bold text-slate-800 leading-tight">{ex.name}</div>
                      <div className={`text-[10px] font-black mt-0.5 inline-block px-1.5 py-0.5 rounded-md ${EX_COLORS[ex.group]||'bg-slate-100 text-slate-500'}`}>{ex.group === 'Custom' ? '自訂' : ex.group}</div>
                    </div>
                  </button>
                  {ex.group !== 'Custom' && (
                    <button onClick={()=>setInfoEx(ex)} className="w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 text-xs font-black">ℹ</button>
                  )}
                </div>
              ))}
              {filtered.length === 0 && (
                <div className="text-center py-10 text-slate-400">
                  <div className="text-3xl mb-2">🤔</div>
                  <div className="font-bold text-sm mb-3">找不到「{search}」</div>
                  {search && <button onClick={()=>saveCustom(search)} className="text-blue-500 font-black text-sm">＋ 加「{search}」為自訂動作（下次仲記得）</button>}
                </div>
              )}
            </div>
          </div>
        </div>
        {infoEx && <ExerciseInfoSheet exercise={infoEx} onClose={()=>setInfoEx(null)} />}
        </>
      );
    };

    // ── Rest timer (between sets) ─────────────────────────────────────────
    const audioState = { ctx: null };
    const unlockAudio = () => { try { audioState.ctx = audioState.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (audioState.ctx.state === 'suspended') audioState.ctx.resume(); } catch {} };
    const beep = () => {
      try {
        const c = audioState.ctx;
        if (c) [0, 0.25, 0.5].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.25; o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.15); });
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } catch {}
    };

    const RestTimer = ({ signal }) => {
      const [dur, setDur] = useState(() => Number(localStorage.getItem('fittrack_rest_dur')) || 90);
      const [endAt, setEndAt] = useState(null);
      const [now, setNow] = useState(Date.now());
      const fired = useRef(false);
      const start = (d) => { fired.current = false; setEndAt(Date.now() + (d || dur) * 1000); setNow(Date.now()); };
      useEffect(() => { if (signal > 0) start(); }, [signal]);
      useEffect(() => { if (!endAt) return; const id = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(id); }, [endAt]);
      const left = endAt ? Math.max(0, Math.ceil((endAt - now) / 1000)) : 0;
      useEffect(() => { if (endAt && left === 0 && !fired.current) { fired.current = true; beep(); } }, [left, endAt]);
      const choose = (d) => { setDur(d); localStorage.setItem('fittrack_rest_dur', String(d)); unlockAudio(); start(d); };
      const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      const running = endAt && left > 0;
      const done = endAt && left === 0;
      return (
        <div className={`sticky bottom-2 z-20 rounded-2xl shadow-lg border p-3 flex items-center gap-2 ${done ? 'bg-green-500 border-green-400 text-white' : running ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-600'}`}>
          {running || done ? (
            <>
              <div className="flex-1">
                <div className="text-[10px] font-black opacity-70">{done ? '休息完畢' : '休息中'}</div>
                <div className="text-xl font-black tabular-nums leading-tight">{done ? '下一組 💪' : mmss(left)}</div>
                {running && <div className="h-1 bg-white/20 rounded-full mt-1 overflow-hidden"><div className="h-full bg-white" style={{ width: `${(left / dur) * 100}%` }} /></div>}
              </div>
              {running && <button type="button" onClick={() => setEndAt(endAt + 15000)} className="px-3 py-2 rounded-xl bg-white/15 text-xs font-black active:scale-95">+15s</button>}
              <button type="button" onClick={() => setEndAt(null)} className="px-3 py-2 rounded-xl bg-white/15 text-xs font-black active:scale-95">{done ? '好' : '跳過'}</button>
            </>
          ) : (
            <>
              <span className="text-xs font-black">⏱ 休息計時</span>
              <div className="flex gap-1.5 ml-auto">
                {[60, 90, 120, 180].map(d => (
                  <button key={d} type="button" onClick={() => choose(d)} className={`px-2.5 py-1.5 rounded-lg text-[11px] font-black active:scale-95 ${dur === d ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`}>{d >= 120 ? `${d / 60}m` : `${d}s`}</button>
                ))}
              </div>
            </>
          )}
        </div>
      );
    };

    // ── Live Gym workout ──────────────────────────────────────────────────
    // Used *while* training: tick each set, rest timer starts by itself, times are
    // recorded automatically. State is saved on every change so closing the app
    // mid-workout loses nothing.
    const ACTIVE_WORKOUT_KEY = 'fittrack_active_workout';
    const KG_PER_LB = 0.453592;
    const fmtNum = (n) => String(Math.round(n * 10) / 10);
    const exSets = (ex) => Array.isArray(ex.sets) ? ex.sets : Array.from({ length: Number(ex.sets) || 1 }, () => ({ weightKg: ex.weightKg || '', reps: ex.reps || '' }));
    const pad2 = (n) => String(n).padStart(2, '0');

    const WorkoutSession = ({ logs, onFinish, onDiscard, onMinimize }) => {
      const [w, setW] = useState(() => readJson(ACTIVE_WORKOUT_KEY, null) || { startedAt: Date.now(), exercises: [] });
      useEffect(() => { try { localStorage.setItem(ACTIVE_WORKOUT_KEY, JSON.stringify(w)); } catch {} }, [w]);

      const [now, setNow] = useState(Date.now());
      useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);
      const elapsed = Math.max(0, Math.floor((now - w.startedAt) / 1000));
      const elapsedStr = `${Math.floor(elapsed / 3600) > 0 ? Math.floor(elapsed / 3600) + ':' : ''}${pad2(Math.floor(elapsed / 60) % 60)}:${pad2(elapsed % 60)}`;

      const [showPicker, setShowPicker] = useState(false);
      const [infoEx, setInfoEx] = useState(null);
      const [restSignal, setRestSignal] = useState(0);
      const [showFinish, setShowFinish] = useState(false);
      const [mood, setMood] = useState('😊');
      const [notes, setNotes] = useState('');
      const [durMin, setDurMin] = useState('');

      // Per-exercise history: last session's sets and all-time best weight (kg)
      const { history, lastGym } = React.useMemo(() => {
        const h = {}; let lg = null;
        [...(logs || [])].filter(l => l.category === 'Gym' && (l.status === 'completed' || !l.status))
          .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
          .forEach(l => {
            let any = false;
            (l.perf?.exercises || []).forEach(ex => {
              if (!ex.name) return;
              const sets = exSets(ex).filter(s => s.reps || s.weightKg);
              if (!sets.length) return;
              any = true;
              const e = h[ex.name] = h[ex.name] || { pr: 0 };
              e.last = { date: l.date, sets };
              sets.forEach(s => { const k = Number(s.weightKg) || 0; if (k > e.pr) e.pr = k; });
            });
            if (any) lg = l;
          });
        return { history: h, lastGym: lg };
      }, [logs]);

      const toUnit = (kg, unit) => unit === 'lb' ? String(Math.round(kg / KG_PER_LB)) : fmtNum(kg);
      // Suggested values for a set: same set last session, else the previous set today
      const hint = (e, k) => {
        const last = history[e.name]?.last?.sets;
        if (last && last.length) {
          const s = last[Math.min(k, last.length - 1)];
          const kg = Number(s.weightKg) || 0;
          return { w: kg ? toUnit(kg, e.unit) : '', r: s.reps ? String(s.reps) : '' };
        }
        const prev = k > 0 ? e.sets[k - 1] : null;
        return prev ? { w: prev.weightKg, r: prev.reps } : { w: '', r: '' };
      };

      const setEx = (i, fn) => setW(p => ({ ...p, exercises: p.exercises.map((e, idx) => idx === i ? fn(e) : e) }));
      const blankSets = (n) => Array.from({ length: n }, () => ({ weightKg: '', reps: '', done: false }));
      const addExercise = (name, group) => {
        const n = history[name]?.last?.sets.length || 3;
        setW(p => ({ ...p, exercises: [...p.exercises, { name, muscleGroup: group || findMuscleGroup(name) || '', unit: 'kg', sets: blankSets(n) }] }));
      };
      const copyLast = () => {
        if (!lastGym) return;
        const ex = lastGym.perf.exercises.filter(e => e.name).map(e => ({ name: e.name, muscleGroup: e.muscleGroup || findMuscleGroup(e.name) || '', unit: 'kg', sets: blankSets(exSets(e).length) }));
        setW(p => ({ ...p, exercises: ex }));
      };
      const updateSet = (i, k, field, val) => setEx(i, e => ({ ...e, sets: e.sets.map((s, idx) => idx === k ? { ...s, [field]: val } : s) }));
      const toggleDone = (i, k) => {
        const wasDone = w.exercises[i].sets[k].done;
        setEx(i, e => ({ ...e, sets: e.sets.map((s, idx) => {
          if (idx !== k) return s;
          if (s.done) return { ...s, done: false };
          const h = hint(e, k);
          return { weightKg: s.weightKg !== '' ? s.weightKg : (h.w || ''), reps: s.reps !== '' ? s.reps : (h.r || ''), done: true };
        }) }));
        if (!wasDone) { unlockAudio(); setRestSignal(s => s + 1); }
      };
      const addSet = (i) => setEx(i, e => { const p = e.sets[e.sets.length - 1]; return { ...e, sets: [...e.sets, { weightKg: p ? p.weightKg : '', reps: p ? p.reps : '', done: false }] }; });
      const dropSet = (i) => setEx(i, e => e.sets.length > 1 ? { ...e, sets: e.sets.slice(0, -1) } : e);
      const removeExercise = (i) => { if (window.confirm(`移除「${w.exercises[i].name}」？`)) setW(p => ({ ...p, exercises: p.exercises.filter((_, idx) => idx !== i) })); };

      const kgOf = (e, s) => (Number(s.weightKg) || 0) * (e.unit === 'lb' ? KG_PER_LB : 1);
      const doneSets = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
      const totalSets = w.exercises.reduce((a, e) => a + e.sets.length, 0);
      const volume = Math.round(w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).reduce((b, s) => b + kgOf(e, s) * (Number(s.reps) || 0), 0), 0));
      const newPRs = w.exercises.filter(e => { const pr = history[e.name]?.pr || 0; return pr > 0 && Math.max(0, ...e.sets.filter(s => s.done).map(s => kgOf(e, s))) > pr + 0.05; }).map(e => e.name);

      const openFinish = () => { setDurMin(String(Math.max(1, Math.round(elapsed / 60)))); setShowFinish(true); };
      const save = () => {
        const start = new Date(w.startedAt);
        const mins = Math.max(1, Math.min(600, Number(durMin) || Math.round(elapsed / 60) || 1));
        const end = new Date(w.startedAt + mins * 60000);
        const hm = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        const exercises = w.exercises.map(e => ({
          name: e.name, muscleGroup: e.muscleGroup,
          sets: e.sets.filter(s => s.done || s.reps !== '').map(s => ({
            weightKg: s.weightKg === '' ? '' : (e.unit === 'lb' ? (Number(s.weightKg) * KG_PER_LB).toFixed(1) : String(s.weightKg)),
            reps: String(s.reps),
          })),
        })).filter(e => e.name && e.sets.length);
        onFinish({
          id: Date.now().toString(), category: 'Gym', subcategory: '重量訓練',
          date: `${start.getFullYear()}-${pad2(start.getMonth() + 1)}-${pad2(start.getDate())}`,
          startTime: hm(start), endTime: hm(end), durationMinutes: mins,
          status: 'completed', effort: 5, performance: 7, mood, friends: [], notes, improvement: '',
          perf: { exercises, distanceKm: '', timeMin: '', heartRate: '', distanceM: '', laps: '' },
        });
      };

      const inputCls = "w-full h-12 rounded-xl text-center text-lg font-semibold tabular outline-none border focus:border-blue-500";

      return (
        <>
          {/* Top bar */}
          <div className="shrink-0 bg-white border-b border-slate-200 px-4 pb-3 safe-area-pt flex items-center gap-3">
            <button onClick={onMinimize} aria-label="收起" className="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 text-lg">↓</button>
            <div className="flex-1 text-center">
              <div className="text-2xl font-bold text-slate-900 tabular leading-none">{elapsedStr}</div>
              <div className="text-xs text-slate-400 mt-1">{doneSets}/{totalSets} 組{volume > 0 ? ` · ${volume.toLocaleString()} kg` : ''}</div>
            </div>
            <button onClick={openFinish} className="h-11 px-5 rounded-full bg-blue-600 text-white text-sm font-bold active:scale-95 transition-transform">完成</button>
          </div>

          {/* Exercises */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {w.exercises.length === 0 && (
              <div className="text-center pt-10 pb-2">
                <div className="text-5xl mb-3">🏋️</div>
                <div className="text-lg font-bold text-slate-800">開始訓練</div>
                <div className="text-sm text-slate-400 mt-1">加入第一個動作，或者沿用上次的課表</div>
              </div>
            )}
            {w.exercises.length === 0 && lastGym && (
              <button onClick={copyLast} className="w-full p-4 rounded-2xl bg-white border border-slate-200 text-left active:bg-slate-50">
                <div className="text-base font-bold text-slate-800">🔁 沿用上次課表</div>
                <div className="text-sm text-slate-400 mt-1 truncate">{lastGym.date.replace(/-/g, '/')} · {lastGym.perf.exercises.filter(e => e.name).map(e => e.name.replace(/\s*\([^)]*\)/g, '')).join('、')}</div>
              </button>
            )}

            {w.exercises.map((e, i) => {
              const hist = history[e.name];
              const allDone = e.sets.length > 0 && e.sets.every(s => s.done);
              return (
                <div key={i} className={`bg-white rounded-2xl border ${allDone ? 'border-green-200' : 'border-slate-200'} overflow-hidden`}>
                  <div className="flex items-center gap-3 p-3">
                    <button onClick={() => setInfoEx({ name: e.name, group: e.muscleGroup || 'Custom' })} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                      <MuscleSvg group={e.muscleGroup} size={40} />
                      <div className="min-w-0">
                        <div className="text-base font-bold text-slate-900 truncate">{e.name}</div>
                        <div className="text-xs text-slate-400 truncate">
                          {hist?.last ? `上次 ${hist.last.sets.map(s => `${s.weightKg ? toUnit(Number(s.weightKg), e.unit) : '—'}×${s.reps || '—'}`).slice(0, 4).join('  ')}` : '第一次做 · 點擊看示範'}
                        </div>
                      </div>
                    </button>
                    <button onClick={() => setEx(i, x => ({ ...x, unit: x.unit === 'lb' ? 'kg' : 'lb' }))} className={`h-9 px-3 rounded-lg text-xs font-bold ${e.unit === 'lb' ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-600'}`}>{e.unit === 'lb' ? 'LB' : 'KG'}</button>
                    <button onClick={() => removeExercise(i)} aria-label="移除動作" className="w-9 h-9 rounded-lg text-slate-300 text-lg">✕</button>
                  </div>

                  <div className="px-3 pb-1 grid grid-cols-[32px_1fr_1fr_52px] gap-2 text-xs text-slate-400 text-center">
                    <div>組</div><div>{e.unit === 'lb' ? 'lb' : 'kg'}</div><div>次數</div><div></div>
                  </div>
                  <div className="px-3 space-y-2">
                    {e.sets.map((s, k) => {
                      const h = hint(e, k);
                      return (
                        <div key={k} className="grid grid-cols-[32px_1fr_1fr_52px] gap-2 items-center">
                          <div className="text-center text-sm font-semibold text-slate-400">{k + 1}</div>
                          <input type="number" inputMode="decimal" value={s.weightKg} placeholder={h.w || '—'} onChange={ev => updateSet(i, k, 'weightKg', ev.target.value)} className={`${inputCls} ${s.done ? 'bg-green-50 border-green-100 text-green-800' : 'bg-slate-50 border-slate-100 text-slate-900'}`} />
                          <input type="number" inputMode="numeric" value={s.reps} placeholder={h.r || '—'} onChange={ev => updateSet(i, k, 'reps', ev.target.value)} className={`${inputCls} ${s.done ? 'bg-green-50 border-green-100 text-green-800' : 'bg-slate-50 border-slate-100 text-slate-900'}`} />
                          <button onClick={() => toggleDone(i, k)} aria-label={s.done ? '取消完成' : '完成此組'} className={`h-12 rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 transition-transform ${s.done ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-300'}`}>✓</button>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex gap-2 p-3">
                    <button onClick={() => addSet(i)} className="flex-1 h-11 rounded-xl bg-slate-50 text-sm font-medium text-slate-600 active:bg-slate-100">＋ 加一組</button>
                    {e.sets.length > 1 && <button onClick={() => dropSet(i)} className="h-11 px-4 rounded-xl bg-slate-50 text-sm font-medium text-slate-400 active:bg-slate-100">− 減一組</button>}
                  </div>
                </div>
              );
            })}

            <button onClick={() => setShowPicker(true)} className="w-full h-14 rounded-2xl border-2 border-dashed border-slate-300 text-base font-bold text-slate-500 active:bg-white">＋ 加動作</button>
            <button onClick={() => { if (window.confirm('放棄今次訓練？已輸入的內容會刪除。')) onDiscard(); }} className="w-full py-3 text-sm text-red-400">放棄訓練</button>
          </div>

          {/* Rest timer */}
          <div className="shrink-0 px-3 pt-2 bg-slate-50" style={{ paddingBottom: 'max(10px, env(safe-area-inset-bottom))' }}>
            <RestTimer signal={restSignal} />
          </div>

          {showPicker && <ExercisePicker onSelect={(name, group) => { addExercise(name, group); setShowPicker(false); }} onClose={() => setShowPicker(false)} />}
          {infoEx && <ExerciseInfoSheet exercise={infoEx} onClose={() => setInfoEx(null)} />}

          {showFinish && (
            <div className="absolute inset-0 z-40 flex flex-col justify-end" style={{ background: 'rgba(15,23,42,0.5)' }} onClick={() => setShowFinish(false)}>
              <div className="bg-white rounded-t-3xl p-5 space-y-4" style={{ paddingBottom: 'max(20px, env(safe-area-inset-bottom))' }} onClick={ev => ev.stopPropagation()}>
                <div className="text-xl font-bold text-slate-900">完成訓練 🎉</div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-slate-50 rounded-2xl p-3"><div className="text-xl font-bold text-slate-900 tabular">{w.exercises.length}</div><div className="text-xs text-slate-400">動作</div></div>
                  <div className="bg-slate-50 rounded-2xl p-3"><div className="text-xl font-bold text-slate-900 tabular">{doneSets}</div><div className="text-xs text-slate-400">完成組數</div></div>
                  <div className="bg-slate-50 rounded-2xl p-3"><div className="text-xl font-bold text-slate-900 tabular">{volume.toLocaleString()}</div><div className="text-xs text-slate-400">總重量 kg</div></div>
                </div>
                {newPRs.length > 0 && <div className="bg-amber-50 text-amber-700 rounded-2xl p-3 text-sm font-medium">🏆 新 PR：{newPRs.join('、')}</div>}
                {doneSets < totalSets && <div className="text-xs text-slate-400">有 {totalSets - doneSets} 組未剔。未剔而且沒有填次數的組不會儲存。</div>}
                <div className="flex items-center gap-3">
                  <label className="text-sm text-slate-500 w-20">時長（分鐘）</label>
                  <input type="number" inputMode="numeric" value={durMin} onChange={ev => setDurMin(ev.target.value)} className="flex-1 h-12 rounded-xl bg-slate-50 border border-slate-100 text-center text-lg font-semibold outline-none" />
                </div>
                <div className="flex justify-between">
                  {['🤩', '😊', '😐', '😫', '😡'].map(m => (
                    <button key={m} onClick={() => setMood(m)} className={`w-12 h-12 rounded-2xl text-2xl ${mood === m ? 'bg-blue-50 ring-2 ring-blue-500' : 'opacity-40'}`}>{m}</button>
                  ))}
                </div>
                <textarea value={notes} onChange={ev => setNotes(ev.target.value)} placeholder="備註（可留空）" className="w-full h-20 p-3 rounded-xl bg-slate-50 border border-slate-100 text-base outline-none resize-none" />
                <div className="flex gap-2">
                  <button onClick={() => setShowFinish(false)} className="h-13 px-5 py-3.5 rounded-2xl bg-slate-100 text-sm font-bold text-slate-600">繼續練</button>
                  <button onClick={save} className="flex-1 py-3.5 rounded-2xl bg-blue-600 text-white text-base font-bold active:scale-[0.98] transition-transform">儲存訓練</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    const Form = ({ onSave, onCancel, onDelete, onCopy, initData, logs, defaultDate, defaultCategory }) => {
      const [data, setData] = useState(() => {
        const cat0 = CATEGORIES.find(c => c.value === defaultCategory) || CATEGORIES[0];
        // Prefill from the last time this sport was logged (same type, time and length)
        const prev = !initData && [...(logs || [])].filter(l => l.category === cat0.value && (l.status === 'completed' || !l.status)).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
        const defaults = {
            category: cat0.value,
            subcategory: prev?.subcategory || (cat0.value === 'Gym' ? '重量訓練' : cat0.subcategories[0]),
            date: defaultDate || getLocalTodayString(),
            startTime: prev?.startTime || '18:00',
            endTime: prev?.endTime || '19:00',
            durationMinutes: prev?.durationMinutes || 60,
            status: 'completed', // 'planned' or 'completed'
            effort: 5, 
            performance: 7, 
            mood: '😊', 
            friends: [],
            notes: '',
            improvement: ''
        };
        
        if (!initData) return defaults;
        // Check for old data missing status
        return { 
            ...defaults, 
            ...initData,
            status: initData.status || 'completed' // Default old data to completed
        };
      });

      const [friendInput, setFriendInput] = useState('');
      const [showFriendDropdown, setShowFriendDropdown] = useState(false);
      const [showPerf, setShowPerf] = useState(() => !!initData?.perf || (initData?.category ?? 'Gym') === 'Gym');
      React.useEffect(() => { if (data.category === 'Gym') setShowPerf(true); }, [data.category]);
      const [perf, setPerf] = useState(() => initData?.perf || { exercises: [], distanceKm: '', timeMin: '', heartRate: '', distanceM: '', laps: '' });
      const [photo, setPhoto] = useState(initData?.photo || null);
      const [photoRemoved, setPhotoRemoved] = useState(false);
      const [restSignal, setRestSignal] = useState(0);
      const [formInfoEx, setFormInfoEx] = useState(null);
      const [showExPicker, setShowExPicker] = useState(false);
      const [exPickerIdx, setExPickerIdx] = useState(null);
      const [showExtra, setShowExtra] = useState(!!(initData?.friends?.length || initData?.notes || initData?.improvement || initData?.photo));

      // Look up the most recent weight logged for an exercise before the current form date
      const getLastWeight = (exName) => {
        if (!exName || !logs) return null;
        const formDate = data.date;
        // newest session first (logs are not guaranteed to be in date order)
        const byNewest = [...logs].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        for (let i = 0; i < byNewest.length; i++) {
          if (byNewest[i].date >= formDate) continue;
          const found = (byNewest[i].perf?.exercises || []).map(normEx).find(e => e.name === exName);
          if (found) {
            const maxW = Math.max(...found.sets.map(s => Number(s.weightKg) || 0));
            if (maxW > 0) return maxW;
          }
        }
        return null;
      };

      // All-time best weight (kg) for an exercise, excluding the log being edited
      const getPR = (exName) => {
        if (!exName || !logs) return null;
        let m = 0;
        logs.forEach(l => {
          if (l.id === initData?.id) return;
          (l.perf?.exercises || []).map(normEx).forEach(e => {
            if (e.name === exName) e.sets.forEach(s => { const w = Number(s.weightKg) || 0; if (w > m) m = w; });
          });
        });
        return m > 0 ? m : null;
      };

      // Most recent completed Gym session with exercises (for one-tap copy)
      const lastGym = (() => {
        const c = (logs || []).filter(l => l.category === 'Gym' && (l.status === 'completed' || !l.status) && l.id !== initData?.id && l.date <= data.date && (l.perf?.exercises || []).some(e => e.name));
        c.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        return c[0] || null;
      })();
      const copyLastGym = () => {
        if (!lastGym) return;
        const ex = lastGym.perf.exercises.map(normEx).filter(e => e.name).map(e => ({
          ...e, unit: 'kg', muscleGroup: e.muscleGroup || findMuscleGroup(e.name),
          sets: e.sets.map(s => ({ weightKg: s.weightKg, reps: s.reps }))
        }));
        setPerf(p => ({ ...p, exercises: ex }));
        setShowPerf(true);
      };
      const startRest = () => { unlockAudio(); setRestSignal(s => s + 1); };

      const compressPhoto = (file) => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 900, ratio = Math.min(maxDim/img.width, maxDim/img.height, 1);
            canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      const GYM_EXERCISES = ['Bench Press','Squat','Deadlift','Pull Up','Shoulder Press','Barbell Row','Incline Press','Lat Pulldown','Dips','Bicep Curl','Tricep Pushdown','Leg Press','Romanian DL','Leg Curl','Lateral Raise','Face Pull','Cable Fly','Calf Press','Leg Extension','Leg Curl','Hip Thrust','Cable Fly','Chest Fly'];

      // Normalise old flat format {weightKg,sets,reps} → new {sets:[{weightKg,reps}]}
      const normEx = (ex) => {
        if (ex.sets && Array.isArray(ex.sets)) return ex;
        const count = Number(ex.sets) || 1;
        return { name: ex.name, muscleGroup: ex.muscleGroup||'', unit: ex.unit||'kg', sets: Array.from({length: count}, () => ({weightKg: ex.weightKg||'', reps: ex.reps||''})) };
      };

      const addExercise = () => setPerf(p => ({...p, exercises: [...p.exercises, {name:'', muscleGroup:'', unit:'kg', sets:[{weightKg:'',reps:''}]}]}));
      const toggleExUnit = (i) => setPerf(p => { const ex=p.exercises.map(normEx); ex[i]={...ex[i], unit: ex[i].unit==='lb'?'kg':'lb'}; return {...p,exercises:ex}; });
      const updateExName = (i, val, group) => setPerf(p => { const ex=[...p.exercises.map(normEx)]; ex[i]={...ex[i],name:val,muscleGroup:group||ex[i].muscleGroup||''}; return {...p,exercises:ex}; });
      const removeEx = (i) => setPerf(p => ({...p, exercises: p.exercises.filter((_,idx)=>idx!==i)}));
      const addSet = (i) => setPerf(p => { const ex=p.exercises.map(normEx); const prev=ex[i].sets[ex[i].sets.length-1]||{weightKg:'',reps:''}; ex[i]={...ex[i],sets:[...ex[i].sets,{weightKg:prev.weightKg,reps:prev.reps}]}; return {...p,exercises:ex}; });
      const updateSet = (ei,si,field,val) => setPerf(p => { const ex=p.exercises.map(normEx); const sets=[...ex[ei].sets]; sets[si]={...sets[si],[field]:val}; ex[ei]={...ex[ei],sets}; return {...p,exercises:ex}; });
      const removeSet = (ei,si) => setPerf(p => { const ex=p.exercises.map(normEx); ex[ei]={...ex[ei],sets:ex[ei].sets.filter((_,idx)=>idx!==si)}; return {...p,exercises:ex}; });
      const exVolume = (ex) => { const n=normEx(ex); return n.sets.reduce((a,s)=>{const v=(Number(s.weightKg)||0)*(Number(s.reps)||0); return a+(v>0?v:0);},0); };
      const totalVolume = perf.exercises.reduce((a,ex)=>a+(exVolume(ex)||0),0);
      const runPace = () => { const d=Number(perf.distanceKm),t=Number(perf.timeMin); return (d>0&&t>0) ? (t/d).toFixed(2) : null; };
      const [quickDuration, setQuickDuration] = useState(() => {
        if (initData?.durationMinutes) {
          return [30,45,60,90,120].includes(initData.durationMinutes) ? initData.durationMinutes : 'custom';
        }
        return 60;
      });
      const [showCopyModal, setShowCopyModal] = useState(false);
      const [copyDates, setCopyDates] = useState([]);

      const allFriends = React.useMemo(() => {
        if(!logs) return [];
        const friendSet = new Set();
        logs.forEach(l => {
           if(l.friends) l.friends.forEach(f => friendSet.add(f));
        });
        return Array.from(friendSet).sort();
      }, [logs]);

      // Derived Frequent Friends
      const recentFriends = React.useMemo(() => {
        if(!logs) return [];
        const friendCounts = {};
        logs.forEach(l => {
           if(l.friends) {
               l.friends.forEach(f => {
                   friendCounts[f] = (friendCounts[f] || 0) + 1;
               });
           }
        });
        return Object.entries(friendCounts)
                     .sort((a,b) => b[1] - a[1]) // Sort by frequency
                     .map(([name]) => name)
                     .slice(0, 8); // Top 8
      }, [logs]);

      useEffect(() => {
        if (!initData) { 
            if (isFutureDate(data.date)) {
                setData(prev => ({ ...prev, status: 'planned' }));
            } else {
                setData(prev => ({ ...prev, status: 'completed' }));
            }
        }
      }, [data.date]);

      useEffect(() => {
        if (quickDuration === 'custom') {
          const mins = calculateDuration(data.startTime, data.endTime);
          setData(prev => ({ ...prev, durationMinutes: mins }));
        }
      }, [data.startTime, data.endTime, quickDuration]);

      useEffect(() => {
        if (quickDuration !== 'custom' && data.startTime) {
          const [h, m] = data.startTime.split(':').map(Number);
          const totalMins = h * 60 + m + quickDuration;
          const newH = Math.floor(totalMins / 60) % 24;
          const newM = totalMins % 60;
          const newEndTime = `${String(newH).padStart(2,'0')}:${String(newM).padStart(2,'0')}`;
          setData(prev => ({ ...prev, endTime: newEndTime, durationMinutes: quickDuration }));
        }
      }, [quickDuration, data.startTime]);

      const isPlanned = data.status === 'planned';

      const addFriend = (name) => {
          const v = name.trim();
          if(v && !data.friends.includes(v)) {
              setData({...data, friends:[...data.friends,v]});
          }
          setFriendInput('');
      };

      return (
        <div className="p-6 animate-slide-up pb-24 space-y-6">
          <div className="flex justify-between items-center">
             <h2 className="text-2xl font-black">{initData ? (isPlanned ? '編輯計劃' : '編輯紀錄') : (isPlanned ? '新增計劃' : '新增紀錄')}</h2>
             <button onClick={onCancel} className="w-8 h-8 flex items-center justify-center bg-white rounded-full border">✕</button>
          </div>

          <div className="bg-white p-5 rounded-3xl space-y-4 border border-slate-100 shadow-sm">
             <div className="grid grid-cols-2 gap-4">
               <div>
                   <label className="text-[10px] font-black text-slate-400 uppercase">日期</label>
                   <input type="date" value={data.date} onChange={e=>setData({...data, date:e.target.value})} className="w-full mt-1 p-3 bg-slate-50 rounded-xl font-bold text-slate-900" />
               </div>
               <div>
                   <label className="text-[10px] font-black text-slate-400 uppercase">狀態</label>
                   <select value={data.status} onChange={e=>setData({...data, status:e.target.value})} className="w-full mt-1 p-3 bg-slate-50 rounded-xl font-bold text-slate-900">
                       <option value="completed">✅ 已完成</option>
                       <option value="planned">📅 計劃中</option>
                   </select>
               </div>
             </div>

             <div>
               <label className="text-[10px] font-black text-slate-400 uppercase">開始時間</label>
               <input type="time" value={data.startTime} onChange={e=>setData({...data, startTime:e.target.value})} className="w-full mt-1 p-3 bg-slate-50 rounded-xl font-bold text-slate-900" />
             </div>

             <div>
               <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block">時長</label>
               <div className="flex flex-wrap gap-2">
                 {[30,45,60,90,120].map(mins => (
                   <button key={mins} type="button" onClick={()=>setQuickDuration(mins)}
                     className={`px-3 py-2 rounded-xl text-sm font-bold transition-all ${quickDuration===mins ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>
                     {mins >= 60 ? `${Math.floor(mins/60)}${mins%60 ? `h${mins%60}m` : 'h'}` : `${mins}m`}
                   </button>
                 ))}
                 <button type="button" onClick={()=>setQuickDuration('custom')}
                   className={`px-3 py-2 rounded-xl text-sm font-bold transition-all ${quickDuration==='custom' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>
                   自訂
                 </button>
               </div>
             </div>

             {quickDuration === 'custom' && (
               <div>
                 <label className="text-[10px] font-black text-slate-400 uppercase">結束時間</label>
                 <input type="time" value={data.endTime} onChange={e=>setData({...data, endTime:e.target.value})} className="w-full mt-1 p-3 bg-slate-50 rounded-xl font-bold text-slate-900" />
               </div>
             )}

             <div className="flex items-center justify-center gap-2 text-xs text-slate-400 font-bold bg-slate-50 py-2 rounded-lg">
                 <span>⏱️ {Math.floor(data.durationMinutes/60)} 小時 {data.durationMinutes%60} 分鐘</span>
             </div>
          </div>

          <div className="grid grid-cols-3 gap-2">
            {CATEGORIES.map(c => (
              <button key={c.value} onClick={()=>setData({...data, category:c.value, subcategory:c.subcategories[0]})} className={`p-2 rounded-2xl border-2 transition-all ${data.category===c.value ? `border-slate-800 bg-white` : 'border-transparent bg-white opacity-40'}`}>
                <div className="text-2xl">{c.icon}</div>
                <div className="text-[9px] font-bold text-slate-500 mt-1">{c.value}</div>
              </button>
            ))}
          </div>

          <div className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
             <label className="text-[10px] font-black text-slate-400 uppercase">項目細節</label>
             <select value={data.subcategory} onChange={e=>setData({...data, subcategory:e.target.value})} className="w-full mt-1 p-3 bg-slate-50 rounded-xl font-bold text-slate-900">
                {CATEGORIES.find(c=>c.value===data.category).subcategories.map(s=><option key={s} value={s}>{s}</option>)}
             </select>
          </div>

          {/* More Details collapsible toggle — only for non-Gym */}
          {data.category !== 'Gym' && !isPlanned && (
            <button type="button" onClick={()=>setShowExtra(p=>!p)} className="w-full flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
              <span className="text-sm font-black text-slate-600">✏️ 更多詳情</span>
              <span className="text-slate-400 font-bold text-lg">{showExtra ? '▲' : '▼'}</span>
            </button>
          )}

          {isPlanned ? (
             <div className="bg-blue-50 p-4 rounded-3xl border border-blue-100 text-center">
                 <p className="text-blue-600 font-bold text-sm">💡 這是未來計劃</p>
                 <p className="text-[10px] text-blue-400 mt-1">心情與夥伴功能將在您將狀態改為「已完成」後顯示。</p>
             </div>
          ) : (data.category !== 'Gym' && !showExtra) ? null : (
             <div className="space-y-6 animate-fade-in">
                <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <label className="text-[10px] font-black text-slate-400 uppercase">訓練心情</label>
                    <div className="flex justify-between mt-2">
                    {['🤩','😊','😐','😫','😡'].map(m => (
                        <button key={m} onClick={()=>setData({...data, mood:m})} className={`text-2xl p-2 rounded-xl transition-all ${data.mood===m ? 'bg-slate-100 scale-125 shadow-sm ring-1 ring-slate-200' : 'opacity-40 grayscale'}`}>{m}</button>
                    ))}
                    </div>
                </div>

                <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <label className="text-[10px] font-black text-slate-400 uppercase">同行夥伴</label>
                    
                    {/* Frequent Friends Suggestions */}
                    {recentFriends.length > 0 && (
                        <div className="mb-3">
                            <p className="text-[9px] text-slate-400 font-bold mb-2">常用好友</p>
                            <div className="flex flex-wrap gap-2">
                                {recentFriends.map(f => {
                                    const isAdded = data.friends.includes(f);
                                    if(isAdded) return null; // Don't show if already added
                                    return (
                                        <button 
                                            key={f}
                                            onClick={() => addFriend(f)}
                                            className="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-600 border border-slate-100 active:scale-95 transition-all"
                                        >
                                            + {f}
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    )}

                    <div className="relative mt-2">
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={friendInput} 
                                onChange={e=>setFriendInput(e.target.value)} 
                                onFocus={() => setShowFriendDropdown(true)}
                                onBlur={() => setTimeout(() => setShowFriendDropdown(false), 200)}
                                placeholder="搜尋或輸入新名字..." 
                                className="flex-1 p-3 bg-slate-50 rounded-xl text-sm text-slate-900 font-bold focus:ring-2 focus:ring-blue-500 outline-none" 
                            />
                            <button onClick={() => addFriend(friendInput)} className="bg-slate-900 text-white px-4 rounded-xl font-bold shadow-lg">+</button>
                        </div>
                        
                        {showFriendDropdown && (
                            <div className="absolute z-10 w-full mt-1 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto custom-scrollbar">
                                {allFriends
                                    .filter(f => f.toLowerCase().includes(friendInput.toLowerCase()) && !data.friends.includes(f))
                                    .map(f => (
                                    <div 
                                        key={f} 
                                        onClick={() => addFriend(f)}
                                        className="p-3 hover:bg-slate-50 cursor-pointer text-sm font-bold text-slate-700 border-b border-slate-50 last:border-0"
                                    >
                                        {f}
                                    </div>
                                ))}
                                {friendInput && !allFriends.some(f => f.toLowerCase() === friendInput.toLowerCase()) && (
                                    <div 
                                        onClick={() => addFriend(friendInput)}
                                        className="p-3 hover:bg-slate-50 cursor-pointer text-sm font-bold text-blue-600 flex items-center gap-2"
                                    >
                                        <span>+ 新增 "{friendInput}"</span>
                                    </div>
                                )}
                                {!friendInput && allFriends.filter(f => !data.friends.includes(f)).length === 0 && (
                                    <div className="p-3 text-sm text-slate-400 text-center">無其他好友</div>
                                )}
                            </div>
                        )}
                    </div>
                    <div className="flex flex-wrap gap-2 mt-3">{data.friends.map(f=><span key={f} onClick={()=>setData({...data, friends:data.friends.filter(x=>x!==f)})} className="bg-blue-600 text-white px-2 py-1 rounded-lg text-xs font-bold cursor-pointer shadow-md shadow-blue-200">{f} ✕</span>)}</div>
                </div>

                {/* New: Notes and Improvements */}
                <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <div>
                        <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block">重點備忘 (Notes)</label>
                        <textarea 
                            value={data.notes} 
                            onChange={e=>setData({...data, notes:e.target.value})} 
                            placeholder="e.g. 試了新球拍，感覺手感不錯..." 
                            className="w-full p-3 bg-slate-50 rounded-xl text-sm text-slate-900 font-medium resize-none h-20 placeholder-slate-300"
                        />
                    </div>
                    <div>
                        <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block">技術筆記 / 待改善 (Tech Notes)</label>
                        <textarea 
                            value={data.improvement} 
                            onChange={e=>setData({...data, improvement:e.target.value})} 
                            placeholder="e.g. 殺球落點太淺，深蹲膝蓋內扣..." 
                            className="w-full p-3 bg-red-50 rounded-xl text-sm text-slate-900 font-medium resize-none h-20 placeholder-red-200 border border-red-100"
                        />
                    </div>
                </div>

                {/* Photo Section */}
                <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5">
                  <label className="text-[10px] font-black text-slate-400 uppercase block mb-3">📸 運動照片</label>
                  {photo ? (
                    <div className="relative">
                      <img src={photo} alt="workout" className="w-full rounded-2xl object-cover" style={{maxHeight:'220px'}} />
                      <button type="button" onClick={()=>{ setPhoto(null); setPhotoRemoved(true); }} className="absolute top-2 right-2 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center text-sm font-bold">✕</button>
                    </div>
                  ) : (
                    <label className="flex flex-col items-center justify-center gap-2 py-5 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer active:opacity-70 transition-opacity">
                      <span className="text-3xl">📸</span>
                      <span className="text-sm font-black text-slate-400">拍照 / 選相</span>
                      <input type="file" accept="image/*" className="hidden" onChange={async(e)=>{ if(e.target.files[0]) setPhoto(await compressPhoto(e.target.files[0])); }} />
                    </label>
                  )}
                </div>
             </div>
          )}

    const Settings = ({ user, handleAuth, setView, onKeyChanged, logs, onForceSync, onImport }) => {
       const [backupMsg, setBackupMsg] = React.useState('');
       const exportBackup = async () => {
         try {
           const payload = JSON.stringify({ app: 'fittrack', version: 2, exportedAt: new Date().toISOString(), logs: logs || [] });
           const name = `fittrack-backup-${getLocalTodayString()}.json`;
           const file = new File([payload], name, { type: 'application/json' });
           if (navigator.canShare && navigator.canShare({ files: [file] })) {
             await navigator.share({ files: [file], title: 'FitTrack 備份' });
           } else {
             const url = URL.createObjectURL(file);
             const a = document.createElement('a'); a.href = url; a.download = name;
             document.body.appendChild(a); a.click(); document.body.removeChild(a);
             setTimeout(() => URL.revokeObjectURL(url), 1000);
           }
           setBackupMsg(`✓ 已匯出 ${logs?.length || 0} 條紀錄`);
         } catch (e) { if (e?.name !== 'AbortError') setBackupMsg('❌ 匯出失敗：' + (e.message || e)); }
       };
       const importBackup = async (file) => {
         try {
           const data = JSON.parse(await file.text());
           const arr = Array.isArray(data) ? data : data.logs;
           if (!Array.isArray(arr) || !arr.every(l => l && l.id && l.date)) throw new Error('檔案格式不正確');
           await onImport(arr);
           setBackupMsg(`✓ 已匯入並合併 ${arr.length} 條紀錄`);
         } catch (e) { setBackupMsg('❌ 匯入失敗：' + (e.message || e)); }

       const photoCount = (logs || []).filter(l => l.photo || l.hasPhoto).length;
       const handleForceSync = async () => {
         setSyncing(true);
         setSyncResult(null);

         setSyncing(false);
         setSyncResult(r);
       };
       const saveKey = () => {

         setTimeout(() => setKeySaved(false), 2000);
       };

               const res = await fetch(window.location.href);
               const text = await res.text();
               const blob = new Blob([text], { type: 'text/html' });
               const url = URL.createObjectURL(blob);
               const a = document.createElement('a');
               a.href = url;
               a.download = 'index.html';
               document.body.appendChild(a);
               a.click();
               document.body.removeChild(a);
               URL.revokeObjectURL(url);
           } catch (e) {
               alert('下載失敗: ' + e.message);
           }
       };

               <h3 className="font-bold text-lg text-slate-800">{user ? user.displayName : '訪客模式'}</h3>
